name: Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'schedule'
    name: Test & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        id: audit
        # Existing advisories must not block incremental dependency fixes.
        # Main, scheduled, and manual audits still fail so the backlog stays visible.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: npm run security:audit 2>&1 | tee "$RUNNER_TEMP/security-audit.txt"

      - name: Summarize security audit
        if: ${{ !cancelled() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          {
            echo '### Dependency security audit'
            echo "Audit result: $AUDIT_OUTCOME."
            echo 'PR audits are advisory so dependencies and security fixes can land incrementally.'
            echo 'Main, daily, and manual audits remain strict. See the audit step and report artifact for details.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security audit report
        if: ${{ !cancelled() && (steps.audit.outcome == 'success' || steps.audit.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: security-audit
          path: ${{ runner.temp }}/security-audit.txt
          retention-days: 14
